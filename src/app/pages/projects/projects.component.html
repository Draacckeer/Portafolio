  <section class="py-16 bg-gray-50 mt-8 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">
    <div class="container mx-auto px-6">
      <h2 class="text-4xl font-bold leading-relaxed text-gray-900 text-center mb-10 animate-slide-in bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent ">
        Mis Proyectos
      </h2>
      <p class="text-lg text-white-600 text-center max-w-2xl mx-auto mb-12 animate-slide-in animate-delay-200">
        Aquí puedes explorar algunos de los proyectos en los que he trabajado.
      </p>

      <!-- Botones de Filtro -->
      <div class="flex justify-center gap-4 mb-8">
        <button
          class="px-4 py-2 rounded-full text-sm font-medium shadow-sm transition-all duration-200 hover:scale-105 hover:shadow-md"
          [ngClass]="
            selectedTag === null
              ? 'bg-gray-900 text-white scale-105 dark:bg-purple-700'
              : 'bg-gray-300 hover:bg-gray-350 dark:bg-gray-700 dark:hover:bg-gray-600'
          "
          (click)="selectTag(null)"
        >
          Todos
        </button>

        <button
          *ngFor="let tag of getUniqueTags()"
          class="px-4 py-2 rounded-full text-sm font-medium shadow-sm transition-all duration-200 hover:scale-105 hover:shadow-md"
          [ngClass]="
            selectedTag === tag.key
              ? 'bg-gray-900 text-white scale-105 shadow-lg dark:bg-purple-700'
              : tag.class
          "
          (click)="selectTag(tag.key)"
        >
          {{ tag.name }}
        </button>
      </div>

      <!-- Lista de Proyectos Filtrados -->
      <div class="flex flex-col items-center gap-y-16">
        <article
          *ngFor="let project of getFilteredProjects(); let i = index"
          class="flex flex-col mt-5 items-center gap-8 md:flex-row md:items-start md:gap-12 w-full max-w-5xl p-8 bg-white rounded-xl shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-2xl hover:-translate-y-1 dark:bg-gray-700 animate-slide-in"
        >
          <!-- Imagen del Proyecto -->
          <div class="w-full md:w-1/2 flex justify-center mt-8 md:mt-0 group">
            <div
              class="relative flex items-center justify-center overflow-hidden rounded-xl shadow-xl transition-all duration-500"
            >
              <img
                [src]="project.image"
                [alt]="project.title"
                class="w-full h-60 object-cover transition-transform duration-500 group-hover:scale-110"
                loading="lazy"
              />
            </div>
          </div>

          <!-- Información del Proyecto -->
          <div class="w-full md:w-1/2 flex flex-col text-center md:text-left">
            <h3 class="text-3xl font-bold text-white-900 mb-4 ">
              {{ project.title }}
            </h3>

            <!-- Tags -->
            <ul
              class="flex flex-wrap justify-center md:justify-start mt-3 mb-6 gap-2"
            >
              <li
                *ngFor="let tag of project.tags"
                class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium shadow-sm"
                [ngClass]="tag.class"
              >
                <div [innerHTML]="getSvg(tag.icon)" class="w-5 h-5"></div>
                <span>{{ tag.name }}</span>
              </li>
            </ul>

            <p class="mb-6 leading-relaxed dark:text-white-900">
              {{ project.description }}
            </p>

            <footer class="flex flex-wrap justify-center md:justify-start gap-4">
              <a
                *ngIf="project.github"
                [href]="project.github"
                target="_blank"
                class="flex items-center gap-2 px-6 py-3 bg-gray-900 text-white rounded-lg transition-all hover:bg-gray-800"
              >
                <div [innerHTML]="getSvg('github')" class="w-5 h-5"></div>
                <span>Ver código</span>
              </a>
              <a
                *ngIf="project.link"
                [href]="project.link"
                target="_blank"
                class="flex items-center gap-2 px-6 py-3 bg-orange-500 text-white rounded-lg transition-all hover:bg-orange-600"
              >
                <span>Ver demo</span>
              </a>
            </footer>
          </div>
        </article>
      </div>
    </div>
  </section>
