<nav class="bg-white dark:bg-gray-900 shadow-lg fixed top-0 w-full z-50">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <!-- Logo -->
    <a routerLink="/home" class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition duration-300">
      Mi Portafolio
    </a>

    <!-- Botón hamburguesa en móvil -->
    <button
      (click)="toggleMenu()"
      class="md:hidden text-gray-500 focus:outline-none transition duration-300"
      [class.text-blue-600]="menuOpen"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        ></path>
      </svg>
    </button>

    <!-- Botón modo claro/oscuro -->
  <button
    (click)="toggleDarkMode()"
    class="ml-4 text-gray-600 dark:text-blue-500 focus:outline-none transition duration-300"
  >
    <ng-container *ngIf="isDarkMode; else sunIcon">
      <!-- Icono luna -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" />
      </svg>
    </ng-container>
    <ng-template #sunIcon>
      <!-- Icono sol -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
        viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v1m0 16v1m8.66-8.66l-.71.71M4.05 4.05l-.71.71M21 12h-1M4 12H3m16.24 4.24l-.71-.71M6.46 6.46l-.71-.71M12 5a7 7 0 100 14 7 7 0 000-14z" />
      </svg>
    </ng-template>
  </button>

    <!-- Menú -->
    <ul
      [class.hidden]="!menuOpen"
      class="absolute md:static top-16 left-0 w-full md:w-auto bg-white md:bg-transparent md:flex space-y-4 md:space-y-0 md:space-x-6 text-gray-500 px-6 md:px-0 py-4 md:py-0 shadow-md md:shadow-none transition-all duration-300 ease-in-out font-semibold dark:bg-gray-800 md:dark:bg-transparent dark:text-gray-200"
    >
      <li>
        <a
          routerLink="/home"
          routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition duration-300"
        >
          Inicio
        </a>
      </li>
      <li>
        <a
          routerLink="/perfil"
          routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition duration-300"
        >
          Perfil
        </a>
      </li>
      <li>
        <a
          routerLink="/proyectos"
          routerLinkActive="text-blue-600 font-semibold"
          class="hover:text-blue-600 transition duration-300"
        >
          Proyectos
        </a>
      </li>
    </ul>
  </div>
</nav>
